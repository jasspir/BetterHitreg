import you.jass.MultiVersionPlugin
import you.jass.AutoVersionPlugin

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false
    id 'maven-publish'
    id 'idea'
}

//26.1+ ships unobfuscated with mojang's official names, it uses the new loom plugin which doesn't remap
//1.21.11 and older are obfuscated and use the remapping loom plugin with mojang mappings
def mcIsAtLeast261 = {
    def a = project.minecraft_version.toString().split(/\./).collect { it.isInteger() ? it.toInteger() : 0 }
    return a[0] >= 26
}()

if (mcIsAtLeast261) apply plugin: 'net.fabricmc.fabric-loom'
else apply plugin: 'net.fabricmc.fabric-loom-remap'

apply plugin: MultiVersionPlugin
apply plugin: AutoVersionPlugin

//the designated gradle version is 9.6.1, you can set it in gradle/wrapper/gradle-wrapper.properties
//distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip
//when the project is done building successfully, you can find the jar in build/libs

//set the minecraft version, then run Tasks/build/autoVersion, it should be in the elephant on the right sidebar in IntelliJ
//after it finishes, run Tasks/build/build, this should build the desired version
//(when switching versions the first build may fail because gradle.properties updates mid-build, just run it again)
autoversion {
    modVersion = '1.0.6'
    mavenGroup = 'you.jass'
    archivesBaseName = 'BetterHitreg'
    minecraftVersion = '26.2'
    yarnMappings = 'auto'
    loaderVersion = 'auto'
    fabricVersion = 'auto'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

//compares dotted versions numerically, so 26.1 > 1.21.11
def isAtLeast = { String v ->
    def a = project.minecraft_version.toString().split(/\./).collect { it.isInteger() ? it.toInteger() : 0 }
    def b = v.split(/\./).collect { it.toInteger() }
    for (int i = 0; i < Math.max(a.size(), b.size()); i++) {
        int ai = i < a.size() ? a[i] : 0
        int bi = i < b.size() ? b[i] : 0
        if (ai != bi) return ai > bi
    }
    return true
}

def isUnobfuscated = mcIsAtLeast261

//26.1+ uses java 25, 1.20.5+ uses java 21, older versions use java 17
def targetJavaVersion = isUnobfuscated ? 25 : (isAtLeast('1.20.5') ? 21 : 17)
def mixinJavaLevel = "JAVA_${targetJavaVersion}"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    if (isUnobfuscated) {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    } else {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    }
}

def classTweaker = isUnobfuscated ? "unobfuscated.classTweaker" : "obfuscated.classTweaker"

loom {
    accessWidenerPath.set(file("src/main/resources/${classTweaker}"))
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "mixin_java_level", mixinJavaLevel
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "class_tweaker": "${classTweaker}"
    }

    filesMatching("betterhitreg.mixins.json") {
        expand "mixin_java_level": mixinJavaLevel
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
